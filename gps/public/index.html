<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Out of Signal</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="./sonar.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <!-- join -->
  <section id="join" class="screen">
    <div class="mark">OUT OF<br>SIGNAL</div>
    <form id="join-form" class="stack">
      <label for="name" class="label">Name</label>
      <input id="name" maxlength="24" required autocomplete="nickname" spellcheck="false">
      <button>Join</button>
    </form>
    <p class="fine">100 m zone · 2 m kill range · 2–8 players</p>
  </section>

  <!-- lobby -->
  <section id="lobby" class="screen" hidden>
    <div class="bar"><span class="label">Lobby</span><span id="count" class="label"></span></div>
    <ul id="players" class="list"></ul>
    <div class="stack">
      <div class="checks">
        <div><span class="label">Sound</span><span id="sound-status">off</span></div>
        <div><span class="label">Location</span><span id="gps-status">off</span></div>
      </div>
      <button id="ready">Enable sound + location</button>
      <button id="start" hidden>Start</button>
      <p id="waiting" class="fine"></p>
      <button id="leave" class="ghost">Leave</button>
    </div>
  </section>

  <!-- game: map only -->
  <section id="game" hidden>
    <div id="map"></div>
    <div class="hud"><span id="role" class="label"></span><span id="timer" class="mono"></span></div>
    <div id="killbar" hidden></div>
    <button id="recenter" class="ghost round" aria-label="Recenter">◎</button>
  </section>

  <!-- end of round -->
  <section id="end" class="screen" hidden>
    <div id="winner" class="mark"></div>
    <p id="reason" class="fine"></p>
    <ul id="reveal" class="list"></ul>
    <div class="stack">
      <button id="reset" hidden>New round</button>
      <p id="end-wait" class="fine"></p>
    </div>
  </section>

  <div id="dead" class="overlay" hidden>
    <div class="mark glitch">SIGNAL<br>LOST</div>
    <p class="fine">You're out. The round goes on without you.</p>
    <button id="spectate" class="ghost">Watch</button>
  </div>

  <button id="reconnect" class="overlay" hidden>
    <span class="mark">TAP</span>
    <span class="fine">Reconnect sound + location</span>
  </button>

  <p id="error" role="alert" hidden></p>
</body>
</html>
